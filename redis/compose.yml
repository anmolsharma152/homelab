services:
  redis:
    image: valkey/valkey:latest
    container_name: redis
    command: valkey-server --save 30 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: unless-stopped
    networks:
      - homelab

volumes:
  redis-data:

networks:
  homelab:
    external: true
