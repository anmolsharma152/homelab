server:
  assets-path: /app/assets

theme:
  use-preset: tokyo-night
  presets:
    default-dark:
      background-color: 235 27 13
      primary-color: 250 84 74
      contrast-multiplier: 1.2
      positive-color: 155 45 65
      negative-color: 348 90 68

    default-light:
      light: true
      background-color: 220 23 95
      contrast-multiplier: 1.0
      primary-color: 220 91 54
      positive-color: 109 58 40
      negative-color: 347 87 44

    teal-city:
      background-color: 225 14 15
      primary-color: 157 47 65
      contrast-multiplier: 1.1

    catppuccin-mocha:
      background-color: 240 21 15
      contrast-multiplier: 1.2
      primary-color: 217 92 83
      positive-color: 115 54 76
      negative-color: 347 70 65

    peachy:
      light: true
      background-color: 28 40 77
      primary-color: 155 100 20
      negative-color: 0 100 60
      contrast-multiplier: 1.1
      text-saturation-multiplier: 0.5

    nord:
      background-color: 220 16 16
      primary-color: 193 43 67
      contrast-multiplier: 1.2
      positive-color: 92 28 65
      negative-color: 354 42 56

    gruvbox-dark:
      background-color: 0 0 16
      primary-color: 43 59 81
      positive-color: 61 66 44
      negative-color: 6 96 59

    kanagawa-dark:
      background-color: 240 13 14
      primary-color: 51 33 68
      negative-color: 358 100 68
      contrast-multiplier: 1.2

    tucan:
      background-color: 50 1 6
      primary-color: 24 97 58
      negative-color: 209 88 54

    solarized-dark:
      background-color: 192 80 9
      primary-color: 45 100 50
      contrast-multiplier: 1.2
      positive-color: 165 70 45
      negative-color: 1 80 60

    emerald-neon:
      background-color: 160 40 8
      primary-color: 150 100 50
      contrast-multiplier: 1.3
      positive-color: 170 100 45
      negative-color: 10 90 55

    rose-pine:
      background-color: 247 23 15
      primary-color: 343 76 68
      contrast-multiplier: 1.2
      positive-color: 170 60 60
      negative-color: 15 85 65

    neon-pink:
      background-color: 240 27 11
      contrast-multiplier: 1.5
      primary-color: 321 100 71
      positive-color: 165 78 51
      negative-color: 360 100 71

    cyberpunk-synthwave:
      background-color: 280 45 10
      primary-color: 315 100 65
      contrast-multiplier: 1.3
      positive-color: 180 100 50
      negative-color: 340 100 60

    oled-pitch-black:
      background-color: 0 0 0
      primary-color: 190 100 60
      contrast-multiplier: 1.4
      positive-color: 130 90 50
      negative-color: 350 100 60

pages:
  - $include: home.yml
  - $include: media.yml
  - $include: artificial_intelligence.yml
  - $include: software_engineering.yml
  - $include: homelab.yml
